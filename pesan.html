<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesan Online — Yum Ricebites</title>
  <meta name="description" content="Pesan Yum Ricebites online: isi nama, nomor telepon, alamat, dan keranjang produk.">
  <meta name="theme-color" content="#ff4aa8">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="pesan">
  <div id="app-header"></div>

  <main>
    <!-- 3.2.4 Fitur Pemesanan -->
    <section class="page-hero">
      <div class="container section-head" style="margin-bottom:10px">
        <span class="eyebrow">Pemesanan</span>
        <h1 class="section-title">Pesan <span class="script">online</span></h1>
        <p class="section-lead">Isi data pemesan dan cek keranjangmu. Pesanan dikirim ke WhatsApp penjual.</p>
      </div>
    </section>

    <section class="section" style="padding-top:30px">
      <div class="container order-grid">
        <!-- Keranjang produk -->
        <div class="panel sticky" aria-labelledby="cart-title">
          <h2 id="cart-title">Keranjang</h2>
          <p>Ubah jumlah atau hapus item.</p>
          <div id="order-cart"></div>
        </div>

        <!-- Form pemesan -->
        <form class="panel panel-form" id="order-form" novalidate aria-labelledby="form-title">
          <h2 id="form-title">Data pemesan</h2>
          <p>Semua kolom bertanda * wajib diisi.</p>

          <div class="field">
            <label for="f-name">Nama *</label>
            <input id="f-name" name="name" type="text" autocomplete="name" placeholder="Nama lengkap" required aria-describedby="err-name">
            <div class="err" id="err-name" role="alert"></div>
          </div>

          <div class="field">
            <label for="f-phone">No. telepon / WhatsApp *</label>
            <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx" required aria-describedby="err-phone">
            <div class="err" id="err-phone" role="alert"></div>
          </div>

          <div class="field">
            <label for="f-address">Alamat pengantaran *</label>
            <textarea id="f-address" name="address" autocomplete="street-address" placeholder="Gedung / ruang / patokan lokasi" required aria-describedby="err-address hint-address"></textarea>
            <div class="hint" id="hint-address" data-shop="deliveryNote">Pengantaran untuk area Klikbi &amp; sekitar Sekolah Vokasi IPB.</div>
            <div class="err" id="err-address" role="alert"></div>
          </div>

          <div class="field">
            <label for="f-note">Catatan <span class="opt">(opsional)</span></label>
            <textarea id="f-note" name="note" placeholder="Mis. tidak pakai sambal, ambil jam 11.00" style="min-height:76px"></textarea>
          </div>

          <button class="btn btn-pink btn-block" type="submit">Buat pesanan</button>
          <p class="hint" style="text-align:center;margin-top:12px">Jam operasional <b data-shop="hours">07.00 – 13.00 WIB</b> · <span class="status" data-open-status style="padding:3px 12px;font-size:12px"></span></p>
        </form>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
